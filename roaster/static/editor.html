<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>曲线编辑器 - Ganf's 咖啡烘焙机</title>
  <script src="js/theme.js?v=3.21"></script>
  <link rel="stylesheet" href="css/theme.css?v=3.21" />
  <link rel="stylesheet" href="assets/icons/phosphor/phosphor.css?v=2.1.2" />
  <link rel="stylesheet" href="css/editor.css?v=3.21" />
  <script src="js/vendor/chart.umd.min.js"></script>
</head>
<body>
  <div id="app" class="editor-app">
    <header class="editor-header">
      <a href="/" class="back-link"><i class="ph ph-arrow-left"></i><span>曲线管理</span></a>
      <div class="editor-title"><span class="eyebrow">PROFILE EDITOR</span><strong>曲线编辑器</strong></div>
      <div class="header-actions">
        <button id="btn-undo" class="ctrl-btn icon-control" aria-label="撤销" title="撤销 (Ctrl+Z)" disabled><i class="ph ph-arrow-counter-clockwise"></i></button>
        <button id="btn-redo" class="ctrl-btn icon-control" aria-label="重做" title="重做 (Ctrl+Y)" disabled><i class="ph ph-arrow-clockwise"></i></button>
        <button id="btn-export" class="ctrl-btn"><i class="ph ph-download-simple"></i><span>导出 JSON</span></button>
        <button id="btn-save" class="ctrl-btn primary"><i class="ph ph-floppy-disk"></i><span>保存曲线</span></button>
      </div>
    </header>

    <section class="profile-meta-bar" aria-label="曲线信息">
      <label class="meta-field meta-name"><span>曲线名称</span><input type="text" id="profile-name" placeholder="例如：中深烘 · 日晒耶加雪菲" /></label>
      <label class="meta-field meta-desc"><span>描述</span><input type="text" id="profile-desc" placeholder="记录豆种、处理法与风味目标" /></label>
      <label class="meta-field meta-temp"><span>结束温度</span><span class="number-shell"><input type="number" id="profile-end-temp" placeholder="210" min="0" max="300" step="1" /><em>°C</em></span></label>
    </section>

    <main class="editor-main">
      <section class="canvas-area">
        <div class="canvas-heading"><div><span class="eyebrow">TARGET CURVE</span><h1>温度与 ROR 目标</h1></div><div class="curve-legend"><span class="curve-key temperature"><i></i>目标温度</span><span class="curve-key ror"><i></i>ROR</span></div></div>
        <div class="chart-wrapper"><canvas id="editor-chart" role="img" aria-label="目标温度曲线编辑画布"></canvas></div>
        <div class="canvas-hint"><span class="hint-item"><i class="ph ph-cursor-click"></i>拖动节点调整时间与温度</span><span class="hint-item"><i class="ph ph-keyboard"></i>Shift 吸附 · 方向键微调 · Ctrl+Z 撤销</span></div>
      </section>

      <aside class="props-panel">
        <section class="panel-block node-library">
          <div class="panel-heading"><div><span class="eyebrow">CONTROL POINTS</span><h2>节点列表</h2></div><button id="btn-add-node" class="ctrl-btn icon-control" aria-label="添加节点" title="添加节点"><i class="ph ph-plus"></i></button></div>
          <div class="nodes-table-header"><span>时间</span><span>温度</span><span>ROR</span><span></span></div>
          <div id="nodes-list" class="nodes-list"></div>
          <div class="panel-actions"><button id="btn-del-node" class="ctrl-btn danger" disabled><i class="ph ph-trash"></i><span>删除选中节点</span></button></div>
        </section>

        <section class="panel-block selection-panel">
          <div class="panel-heading"><div><span class="eyebrow">SELECTION</span><h2>选中节点</h2></div></div>
          <div class="form-row form-row-time"><label>时间</label><div class="time-inputs"><span class="number-shell"><input type="number" id="sel-time-min" min="0" step="1" inputmode="numeric" /><em>分</em></span><span class="number-shell"><input type="number" id="sel-time-sec" min="0" step="1" inputmode="numeric" /><em>秒</em></span></div></div>
          <div class="form-row"><label for="sel-temp">温度</label><span class="number-shell"><input type="number" id="sel-temp" min="0" max="300" step="0.1" /><em>°C</em></span></div>
        </section>

        <section class="panel-block ror-panel"><div class="panel-heading"><div><span class="eyebrow">RATE OF RISE</span><h2>ROR 预览</h2></div></div><div class="ror-list" id="ror-list"></div></section>
      </aside>
    </main>
  </div>
  <div id="editor-toast" class="editor-toast" role="status" aria-live="polite"></div>
  <script src="js/tauri-adapter.js?v=3.21"></script>
  <script src="js/utils.js?v=3.21"></script>
  <script src="js/editor.js?v=3.21"></script>
</body>
</html>
